
name: terraform-ci

on:

  push:
    branches: [ "main" ]
    paths: ["environment/**", "modules/**"]
    
  pull_request:
    branches: [ "main" ]
    paths: ["environment/**", "modules/**", ".github/workflows/terraform-ci.yml"]
  
  workflow_dispatch:
permissions: 
  id-token: write
  contents: read

env:
  TF_VERSION: "1.11.4"
  TF_DIR: environment/dev
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_key_name: ${{ vars.TF_VAR_KEY_NAME }}
  TF_VAR_alert_email: ${{ vars.TF_VAR_ALERT_EMAIL }}

concurrency:
  group: terraform-dev
  cancel-in-progress: false
    

jobs:
  
  checks:
    name: Format, validate, TFlint, scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - name: TFlint
        run: |
          tflint --init
          tflint --recursive

      - name: Trivy IaC scan 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  plan:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      #- name: debug role secret
       # env:
        #  ARN: ${{ secrets.AWS_ROLE_ARN }}
        #run:  |
         # echo " length: ${#ARN}"
          #echo " role name: ${ARN##*/}"
          

      #- name: debug oidc claim 
       # run: |
        #  TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
         #   "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          #PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          #echo "$PAYLOAD$(printf '=%.0s' 1 2 3)" | base64 -d 2>/dev/null | jq '{sub, aud, iss}'
      # ---- end of debug steps ----

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: show plan in job summary
        run: |
         {
          echo '### terraform plan' 
          echo '```' 
          terraform show -no-color tfplan
          echo '```'
          
         } >> "$GITHUB_STEP_SUMMARY"

      - name: upload plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1
          
  apply:
    name: Terraform apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    concurrency:
      group: terraform-dev-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Init
        run: terraform init

      - name: Apply 
        run: terraform apply -input=false tfplan



          
