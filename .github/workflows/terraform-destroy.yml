# This is a basic workflow to help you get started with Actions

name: terraform

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type "destroy-dev" to confirm'
        required: true

permissions: 
  id-token: write
  contents: read

env:
  TF_VERSION: "1.11.4"
  TF_DIR: environment/dev
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_key_name: ${{ vars.TF_VAR_KEY_NAME }}
  TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}

concurrency:
  group: terraform-dev
  cancel-in-progress: false


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  destroy:
    name: terraform destroy
    if: ${{ inputs.confirm == 'destroy-dev' && github.ref == 'refs/heads/main' }}
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment: dev-destroy

    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
  

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Plan destroy
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: show destroy plan in job summary
        run: |
          echo '### Terraform destroy plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color destroy.tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy
        run: terraform apply -input=false destroy.tfplan


      




          
