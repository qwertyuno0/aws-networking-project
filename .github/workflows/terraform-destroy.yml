
name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type "destroy-dev" to confirm'
        required: true

permissions: 
  id-token: write
  contents: read

env:
  TF_VERSION: "1.11.4"
  TF_DIR: environment/dev
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_key_name: ${{ vars.TF_VAR_KEY_NAME }}
  TF_VAR_alert_email: ${{ vars.TF_VAR_ALERT_EMAIL }}

concurrency:
  group: terraform-dev
  cancel-in-progress: false


jobs:
  destroy:
    name: Terraform destroy
    if: ${{ inputs.confirm == 'destroy-dev' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: dev-destroy

    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
  

    steps:
      - name: Verify confirmation
        if: ${{ inputs.confirm != 'destroy-dev' }}
        run: |
          echo "confirmation text did not match." >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Plan destroy
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: show destroy plan in job summary
        run: |
          echo '### Terraform destroy plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color destroy.tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy
        run: terraform apply -input=false destroy.tfplan


      




          
